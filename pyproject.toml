[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jestkontrol"
version = "0.1.0"
description = "Hand-gesture based computer control system"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.package-data]
jestkontrol = ["ui/assets/*.json", "ui/assets/art/*.png"]
